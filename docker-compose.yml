services:
  inference:
    image: ghcr.io/jules-gp/lab-ai:2026.07
    environment:
      - API_TOKEN=${API_TOKEN:-dev-token}
      - MODELS_DIR=/models
      - DEVICE=cpu
    shm_size: 8gb
    working_dir: /workspace/server
    volumes:
      - ./server:/workspace/server
      - /data/models:/models:ro
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]