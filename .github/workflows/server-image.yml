name: server image

# Publishes docker/server.Dockerfile as ghcr.io/dcbia-orthologab/visor-serve,
# the image docker-compose.yml runs. It holds the server and what tool
# virtualenvs load from the system -- no tool -- so it is small enough to build
# on a hosted runner.
#
# Tags:
#   main          the latest build of main; docker-compose.yml's default
#   sha-<short>   every build, so a deployment can pin exactly what it runs
#   server-...    a `server-YYYY.MM.DD-N` git tag publishes under that name
#
# The package belongs to the organisation and inherits nothing from the
# repository's visibility: the first publish creates it private, and making it
# public is one click under the organisation's Packages settings. Until then a
# deployment pulls it only after `docker login ghcr.io`.

on:
  push:
    branches: [main]
    tags: ["server-*"]
    paths:
      - docker/server.Dockerfile
      - server/**
      - .github/workflows/server-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: docker build -f docker/server.Dockerfile -t visor-serve .

      - name: Push
        env:
          IMAGE: ghcr.io/dcbia-orthologab/visor-serve
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tags="sha-${GITHUB_SHA::7}"
          if [ "$REF_TYPE" = tag ]; then
            tags="$tags $REF_NAME"
          else
            tags="$tags main"
          fi
          for tag in $tags; do
            docker tag visor-serve "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
