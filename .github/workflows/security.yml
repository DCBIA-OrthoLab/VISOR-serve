name: security

# Four checks a server holding confidential imaging depends on: no credential
# lands in the history, the Python carries no known-dangerous pattern, the
# API's dependencies carry no published vulnerability, and the workflows
# themselves cannot be turned against the repository.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a rule or an advisory published upstream reaches code nobody
  # has touched since.
  schedule:
    - cron: "29 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history: a token removed in a later commit is still public.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The image, pinned by digest, rather than gitleaks-action, which needs
      # a paid licence on an organisation's repository. Known placeholders are
      # listed, one fingerprint each, in .gitleaksignore.
      - name: Scan the history
        run: >
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact --exit-code 1

  python:
    name: python (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install bandit
        run: python -m pip install "bandit==1.9.*"
      # Medium severity and up fails the job. Tests and benchmarks are left
      # out: their fixed /tmp paths and fake servers are what they are for. A
      # finding that is not one is marked `# nosec <rule>` with the reason on
      # the line above. B608 (SQL built from strings) is skipped: there is no
      # SQL database, and every hit is an HTML page assembled from constants.
      - name: Scan
        run: bandit -r . -x './.git,*/tests/*,./benchmarks' -s B608 -ll -q

  dependencies:
    name: dependencies (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.*"
      # requirements-api.txt is all the server image installs, unpinned, so it
      # resolves here to what the next image build would get. A tool's own
      # dependencies live in the tools repository and are audited there.
      - name: Audit the API's dependencies
        run: pip-audit -r server/requirements-api.txt --progress-spinner off

  workflows:
    name: workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install zizmor
        run: python -m pip install "zizmor==1.*"
      # Offline: the online audits call the GitHub API, and the runner's
      # token is read-only here anyway.
      - name: Audit
        run: zizmor --offline --min-severity medium .github/workflows
