# Per-tool overrides. Adding a tool needs NOTHING here: conventions.py derives
# which arguments are filled from DATA/, which are hidden from a clinician, and
# which DATA/ folder a tool reads. Every tool currently served is covered by
# them, which is why this file has no entries.
#
# Write a section only for an exception:
#
#   [tools.MyTool]
#   server_selectable = { atlas = "model" }   # not named *_model, but hosted
#   hidden = ["iterations"]                   # technical, not in TECHNICAL
#   data_dir = "MyToolData"                   # DATA/ folder named differently
#   max_upload_mb = 500                       # this tool alone takes more
#
# Anything stated here wins, per argument, over the convention.

# AREG's bundles are staged under DATA/AREG/ -- one folder, shared by the two
# engines the split produced. Without this, each looks for DATA/<its own name>/
# and falls back to the run-together spelling (`AREGIOS`), so a hosted model
# selected by name answers 404 for a folder that was never going to exist.
[tools.AREG_CBCT]
data_dir = "AREG"
# `t1_masks` is the clinician's OWN segmentations of their own patients. The
# convention reads a file argument as "offer what the server hosts for this
# tool too", which put a dropdown of AREG's reference test files in front of a
# field where picking one would register a patient against somebody else's
# masks. Nothing on this server is a plausible answer here, so the field stops
# offering any.
# And `segmentation_model` opts out too, for the reason [tools.ASO] gives
# below about its own: the convention fills an unnamed model argument with
# DATA/<tool>/models/ -- the FOLDER -- and AREG passed that straight to AMASSS,
# which answered "No nnUNet model found in 'models'". The folder is not a
# bundle. Left empty, AREG sends no model and AMASSS resolves its own bundle,
# which is the one answer there was ever going to be.
# One folder per ARGUMENT, not per modality. Scoped to the modality, the
# picker still offered whole cohorts -- `<name>/{T1,T2}/` -- so the baseline
# field listed entries holding the follow-up too, and the intraoral field
# listed entries holding a CBCT. The per-argument folders are hardlinked views
# of the same cohorts, built by the tools repository's fetch script (`split`
# in its data manifest), so they cost directory entries and no data. Scoped to
# a folder no script built, a fresh deployment had empty pickers.
#
# `t1`/`t2` draw from DATA/AREG/testfiles/CBCT_T1|CBCT_T2 only. This tool registers
# volumes; the intraoral cohorts staged beside them for the other two engines
# cannot be a baseline, and offering them put a folder of `.vtk` one click away
# from a CBCT picker.
server_selectable = { t1_masks = "none", segmentation_model = "none", landmark_model = "none", t1 = "testfile:CBCT_T1", t2 = "testfile:CBCT_T2" }
# Its channels are REGISTRATIONS -- one region of one subject each, run side by
# side and each on one elastix thread -- and it asks for its width at run time
# (`sup.channels`), once it has paired the subjects. The subjects cannot be
# counted from outside: `t1` and `t2` are two paired folders. The regions can,
# so they bound the reservation: a two-region run reserves at most two
# registrations' worth for its whole life, where an unbounded ladder would hold
# every registration the machine could afford through hours of nested calls.
# A cohort therefore runs no wider than its region count; that is the cost of
# reserving before the tool can say how many subjects it paired.
width_from = "regions"
# And each registration brings its own share of cores: elastix scales with the
# threads it is given (97 s on ten, 43 s on fifty-six), so two registrations
# side by side on ten threads each finish in about the time of one (102 and
# 115 s against 97), where dividing ten threads between them gained nothing.
cores_per_channel = true

[tools.AREG_IOS]
data_dir = "AREG"
# The intraoral cohorts, IOS_T1|IOS_T2, for the same reason AREG_CBCT takes only
# the CBCT ones.
# `crown_model` opts out here too: a name has to mean ONE thing across the
# engines the AREG facade composes, and IOSCBCT having opted its own out is
# what made the facade refuse to publish at all.
#
# The three remaining model arguments opt out for the reason AREG_CBCT gives
# about its own `segmentation_model`: the convention fills an unnamed model
# argument with DATA/<tool>/models/ -- the FOLDER, which holds every AREG bundle
# together, around sixty checkpoints. This engine then died on "'models' holds
# several checkpoints: 'registration_model' has to name an entry holding exactly
# one", AFTER it had segmented and oriented both timepoints, so the failure cost
# the whole prediction. Left genuinely empty, the tool resolves `AREG_model` and
# `IOS_Gold_files` itself (dispatch._own_bundle) and ALI_IOS resolves the
# mucogingival bundle, as it does every other landmark bundle in this family.
#
# `ios_reference`, not `reference`: AREG_CBCT publishes a `reference` that IS a
# clinical choice -- Frankfurt or Occlusal -- and keeps its dropdown. Opting out
# under the shared name would have changed what that name means between two
# engines of one facade, which is what the note above is about.
server_selectable = { t1 = "testfile:IOS_T1", t2 = "testfile:IOS_T2", crown_model = "none", registration_model = "none", mgl_model = "none", ios_reference = "none" }

# Orchestrates four tools and computes almost nothing itself; see the rule in
# deployment.toml.example. Chain measured today: Crown_Seg ~52s + ALI_IOS ~45s +
# ALI_CBCT ~45s + ASO ~15s = ~157s, plus 20% = ~190s. Left unset here so the
# global default applies while the chain is still being measured.
[tools.AREG_IOSCBCT]
data_dir = "AREG"
# Its cohorts hold BOTH modalities -- a patient's intraoral scans and their
# CBCT, which is the pairing this engine registers -- so all four inputs draw
# from the one folder staged for it.
# The four model arguments opt OUT of the hosted-model convention, which fills
# an unnamed one with DATA/<tool>/models/ -- the FOLDER, which is not a bundle
# and is what AMASSS refused with "No nnUNet model found in 'models'". Left
# genuinely empty, each callee resolves its own weights (Crown_Seg, ALI_IOS and
# ALI_CBCT all can), and the orientation reference is resolved by this engine,
# there being one frame the rest of the chain expects.
server_selectable = { ios = "testfile:IOSCBCT", cbct = "testfile:IOSCBCT", ios_landmarks = "testfile:IOSCBCT", cbct_landmarks = "testfile:IOSCBCT", crown_model = "none", ios_landmark_model = "none", landmark_model = "none", cbct_reference = "none" }

# The two ALI engines share DATA/ALI/, one folder holding both bundles. Without
# this each looks for DATA/<its own name>/ and falls back to the run-together
# spelling (ALICBCT), which was never going to exist.
# ALI_CBCT searches a scan's landmarks in parallel PROCESSES, and the width is
# no longer capped here: the two things that used to make a wide run worse have
# both been fixed in the engine, and the ceiling was a workaround for them.
#
# Measured on the reference scan's 119 landmarks, real bundle, RTX 6000 Ada,
# card otherwise idle. Every width places the same 114 landmarks, and every
# coordinate is identical to width 1 to the last bit (max |delta| = 0.0 mm):
#
#   width   before    after     card
#       1   358.7 s        -   1.4 GiB
#       4   191.4 s  141.3 s   3.7 GiB
#       8   425.1 s  128.0 s   6.8 GiB
#      12   456.5 s  127.3 s   9.7 GiB
#
# "before" is the honest shape of the trap: past four agents a wider run was
# SLOWER THAN NO PARALLELISM AT ALL, and nothing in the report said so -- it
# finished, it placed every landmark, it just took longer. The volume lives in
# host memory, so every step crops and rescales it on the CPU: 0.9 ms of
# arithmetic that enters torch's intra-op pool and occupies about ten cores
# doing it. Twelve workers asked 42 cores for 120. `torch.set_num_threads(1)`
# in each worker, on the card only, is the whole fix.
#
# **The budget is counted in STEPS now, not seconds, and that is what let the
# cap go.** A wall clock made the bound depend on how busy the machine was, so
# four agents sharing one card dropped C4 -- reported as "did not converge",
# which a clinician cannot tell from a landmark genuinely outside the field of
# view. A step is a forward pass and means the same thing at any width.
#
# **After eight, it is flat**: 8 -> 12 buys 0.7 s for 3 GiB more card. Nothing
# enforces that, deliberately. A cap inside the tool would not shrink what
# admission RESERVED -- that is decided before anyone can ask -- so it would
# trade real speed for no real room, and it would put a number that cannot see
# the machine back inside the tool. The card's own budget is what bounds this.
#
# Threads were tried first and refused, twice, and the reason first written
# here was wrong: an agent's step is not "microseconds of kernel around a lot
# of Python". Measured inside it -- 15.50 ms a step, of which the forward pass
# is 15.16 (97.8 %), the batch preparation 0.28 and the argmax 0.06. The GIL
# is held for essentially all of it, inside torch's own dispatch, which is why
# a thread pool came out at x1.04. Processes do not share a GIL; that is the
# whole difference, and it is worth 2.80x.
[tools.ALI_CBCT]
data_dir = "ALI"
# Its channels are the LANDMARKS searched within one scan, not the scans -- so
# the batch axis (`input`, a folder of them) is the wrong thing to count, and
# this says so. One landmark then gets one worker instead of two, which saves
# the ~3 s a second process costs to launch and does one landmark's work.
#
# **This is now the bound on the RESERVATION only, not on the width.** ALI_CBCT
# asks for its width (`sup.channels`), because the count that matters is what
# the bundle has weights for crossed with what was requested, and that is
# knowable only at run time. Two cases show the difference, both run here on
# 2026-09-18 against the real tool through the real runner: a request naming
# seven landmarks counts seven, reserves seven and is answered seven; a request
# naming a REGION counts nothing -- `landmarks` is empty and the regions decide
# -- so the ladder is bounded only by what is affordable, while the tool is
# answered the five its bundle actually has. The line stays because the
# reservation is taken before anyone can ask, and a width nothing bounds is
# paid for in memory nobody uses; see `execution/concurrency.py`'s header for
# what that cost on AMASSS.
width_from = "landmarks"

[tools.ALI_IOS]
data_dir = "ALI"
# Its channels are the TEETH of one mesh -- "the loop is mesh-outer,
# tooth-inner, and `num_workers` widens the INNER one", in the engine's own
# words -- and how many teeth a mesh carries is read from its label array at
# run time, which is after admission has decided. So there is nothing in the
# request to count: the batch axis (`input`, a folder of meshes) would bound a
# single-mesh run at one channel and leave the teeth to run one at a time.
width_from = false

[tools.AMASSS]
# Its channels are the STRUCTURES predicted within one scan, not the scans --
# the same shape as ALI_CBCT above, and the batch axis (`scans`, a folder of
# them) is the wrong thing to count for exactly the same reason. One nnUNet
# call is a third inference and two thirds preprocessing on a single core, so
# a run leaves the card idle most of its own length; overlapping the
# structures is what fills that, and it is worth doing on ONE patient.
#
# Counted from `structures`, which is a multichoice, so `_count` reads the
# TICKED options: the default five bound the ladder at five, and a clinician
# asking for the mandible alone reserves for one. The request narrows the
# reservation without anybody declaring a number.
#
# Without this line the ladder is bounded by the scans in the request, which
# on the ordinary single-patient run is one -- so the tool asked for five
# structures and was answered one, and the card stayed at 2.4 GiB while the
# run took as long as it always had.
width_from = "structures"
# AMASSS has one model and resolves it itself when `model` is empty, from
# DATA/AMASSS/models/AMASSS_Models. The convention would fill the argument with
# the models FOLDER, which is not a bundle, and would put a picker with a
# single answer in front of a clinician. So it is neither filled nor asked;
# a caller that names a bundle is still obeyed.
server_selectable = { model = "none" }
hidden = ["model"]

# AREG became three tools when it was split, one per modality, because the
# engines cannot share a virtualenv. This publishes the name callers already
# have -- every Slicer module names `AREG` -- as a choice between them. The
# schema is composed from the three at startup, so changing one of them changes
# what this offers, with nothing to keep in sync.
[tools.AREG]
# "IOS to CBCT", and not the reverse: that is the wording the published
# extension puts in front of clinicians -- AREG.ui's own CbInputType offers
# "CBCT to CBCT", "IOS to IOS", "IOS to CBCT" -- and it is also the direction
# of the operation, an intraoral surface being moved onto a CBCT. The mode
# name travels on the wire, so a saved request holding the old spelling has
# to be re-made; nothing else reads it.
dispatch = { "CBCT" = "AREG_CBCT", "IOS" = "AREG_IOS", "IOS to CBCT" = "AREG_IOSCBCT" }

[tools.ASO]
# `landmark_model` is no longer a bundle this tool HOSTS. It names the weights
# the landmark tool predicts with, and that tool now finds its own -- so the
# convention that reads `*_model` as "pick one from DATA/ASO/models/" would fill
# it with ASO's own model folder and pass that on as ALI's bundle. Measured in a
# real run on 2026-09-11: ALI received `DATA/ASO/models` and predicted with the
# wrong weights, silently. "none" opts it out; a caller may still name a bundle
# to pin which weights ran.
server_selectable = { landmark_model = "none" }

[tools.ALI]
# "IOS", the word AREG's facade already uses and the word the original
# extension used. One tool saying "Intraoral scan" and its neighbour saying
# "IOS" for the same thing is a difference a reader has to check is not a
# difference.
dispatch = { "CBCT" = "ALI_CBCT", "IOS" = "ALI_IOS" }

# FlexReg's `reference` is the patient's OWN other timepoint, uploaded with the
# rest, not a hosted bundle. The convention reads any argument named `reference`
# as a model picked from DATA/<tool>/models/, which left the panel offering an
# empty dropdown and reporting "no model available on the server" for a tool
# that has none and needs none. `surfaces` is likewise always uploaded: there
# are no reference arches to run against.
# AutoMatrix's `reference` is the SAME case, and had the same symptom: an
# optional volume the caller supplies to define the output grid, read by the
# convention as a hosted bundle and rendered as a dropdown over an empty
# `DATA/AutoMatrix/models/`. A clinician could not pick their own file at all.
# "testfile" rather than "none" so a deployment that stages a standard grid
# offers it, while an upload stays possible either way.
[tools.AutoMatrix]
# Not a hosted anything. `reference` matched the `*_reference` convention and
# was published as a MODEL, behind a dropdown of an empty models folder; making
# it a test file only swapped that for a dropdown of whole demo datasets, which
# is no more a reference volume than a bundle was. It is an ordinary optional
# input the caller supplies, and the panel hides it.
server_selectable = { reference = "none" }

[tools.FlexReg]
# Both take a hosted arch now: DATA/FlexReg/testfiles/Arches holds one upper and
# one lower, each carrying per-tooth labels. `reference` stays out of the model
# convention -- it is the patient's own other timepoint, not a bundle -- but it
# is a surface a caller may well want to pick from the server.
server_selectable = { surfaces = "testfile", reference = "testfile" }

[tools.CNE]
# The one tool whose run is dominated by loading its model: a 4.4 GB quantised
# GGUF, once per call. Notes are kilobytes, so a cohort of them is never a
# transfer problem -- splitting it into five batches would be five loads of
# 4.4 GB bought with nothing. This is the input to the batching decision that
# is genuinely the tool's rather than this machine's, which is why the server
# cannot derive it and it is written down here.
batch = false


# CLIC's channel is a SLICE of a volume, and how many slices there are is not
# known until the volume has been read -- which is after admission has decided.
# `false` says so, rather than letting the batch axis count its scans and bound
# the slice batch by the cohort size, which would be a different number
# entirely.
[tools.CLIC]
width_from = false


# VFACE orchestrates seven tools and computes the measurements itself. It is
# declared here for its DATA folder and, above all, to opt ten arguments out of
# the hosted-file convention -- for four different reasons, which is why they are
# listed apart below rather than as one gesture.
#
# SEVEN are bundles this tool resolves itself (`dispatch._BUNDLES`):
# `segmentation_model`, `classifier_model`, `cranial_base_reference`,
# `maxilla_reference`, `mirror_reference`, `measurements`, `feature_template`.
# The convention fills an unnamed model argument with DATA/<tool>/models/ -- the
# FOLDER, which here holds six bundles at once -- so each callee would be handed
# a directory that is not a bundle. AREG showed what that costs: the run dies
# after the segmentation and the orientation have already been paid for. None of
# them is a clinical choice either: one classifier, one mirror transform, one
# reference per frame, one measurement list per region.
#
# `landmark_model` opts out for the reason [tools.ASO] gives about its own:
# ALI_CBCT finds its own weights from the same data root, and a name held here
# would be AREG holding a name for its neighbour's storage.
#
# `surface_model` is Batch_Dental_Seg's, and this deployment publishes none. Left
# offering the models folder, the heat-map path would fail inside a child process
# instead of saying which bundle is missing.
#
# `registration_transforms` is the clinician's OWN transforms, for the mode that
# measures scans somebody else registered. Nothing this server hosts is a
# plausible answer, and a dropdown of reference test files in front of that field
# is an invitation to measure a patient against another patient's registration --
# the same reason [tools.AREG_CBCT] opts `t1_masks` out.
#
# `t1` is scoped to the one hosted cohort that holds volumes. `Testing` holds
# landmarks and a ground-truth spreadsheet, so offering the testfiles folder
# whole puts a directory of .json one click away from a scan picker; and the
# scope this carried first, `Scans`, named a folder nothing stages -- the
# manifest's VFACE entries land in `Testing` and `CBCT_Or_FullyAuto`, so the
# picker was empty on every fresh install. An empty dropdown reads as "this
# deployment hosts no scans", which is the one thing it does host.
#
# `t2` is opted out rather than pointed at the same cohort. It is the FOLLOW-UP
# of a longitudinal study, the hosted cohort holds a single timepoint
# (`C_0001_T1.nii.gz`), and a picker offering it on both sides is an invitation
# to register a patient against themselves -- which does not fail, it returns a
# study reporting no change. The clinician's own second timepoint is an upload,
# which `"none"` leaves in place: it removes the hosted kind, not the argument.
[tools.VFACE]
data_dir = "VFACE"
server_selectable = { t1 = "testfile:CBCT_Or_FullyAuto", t2 = "none", segmentation_model = "none", landmark_model = "none", classifier_model = "none", surface_model = "none", cranial_base_reference = "none", maxilla_reference = "none", mirror_reference = "none", measurements = "none", feature_template = "none", registration_transforms = "none" }

[tools.GreedyReg]
# Each side of a registration is ONE timepoint, and the tool refuses a folder
# holding both -- "the two will be paired timepoint against timepoint and the
# run will look like it worked". The hosted cohort splits them into `T1/` and
# `T2/`, so both pickers draw from inside it rather than offering the cohort
# folder the tool cannot accept.
server_selectable = { t1 = "testfile:CBCT_T1_T2_pair", t2 = "testfile:CBCT_T1_T2_pair" }
