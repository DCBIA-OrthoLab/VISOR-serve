# Per-tool server-side configuration for the PACKAGED tools in sadt-tools.
#
# `data_dir` is load-bearing: a packaged tool is named after its folder, which
# is lowercase (`amasss`), while the data staged by scripts/setup-models.sh is
# not (`DATA/AMASSS/`). Without this the lookup falls back to the tool's own
# name and finds nothing -- no models, no test files, and a `model` argument
# published as a bare path the client cannot fill in.
#
# `server_selectable` says which arguments the client picks from server-side
# data rather than uploading. Weights never travel.

[tools.amasss]
data_dir = "AMASSS"
server_selectable = { model = "model", scans = "testfile" }

[tools.batchdentalseg]
data_dir = "BatchDentalSeg"
server_selectable = { model = "model", scans = "testfile" }

[tools.crownseg]
data_dir = "CrownSeg"
server_selectable = { model = "model", meshes = "testfile" }

[tools.surgmovpred]
data_dir = "SurgMovPred"
server_selectable = { model = "model", measurements = "testfile" }
