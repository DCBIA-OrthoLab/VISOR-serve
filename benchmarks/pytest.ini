[pytest]
# The harness's own suite only. Nothing here imports the server, so it runs on a
# machine with no GPU, no Docker and no running server -- which is the point: a
# reviewer must be able to inspect the harness before deciding to run it.
testpaths = tests

markers =
    needs_server: needs the API answering at server.base_url. Skipped otherwise.
    needs_docker: needs the deployment container running. Skipped otherwise.
    needs_gpu: needs an NVIDIA card and nvidia-smi. Skipped otherwise.
