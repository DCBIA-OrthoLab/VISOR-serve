# Server-side data: what to download, and where it goes.
#
# Read by scripts/fetch_data.py (and therefore by setup-models.sh /
# setup-testfiles.sh). Every entry lands under the layout server/data_store.py
# reads, so a file fetched here shows up in GET /tools/<tool>/data with no
# further step:
#
#     DATA/<tool>/models/<name>
#     DATA/<tool>/testfiles/<name>
#
# ---------------------------------------------------------------------------
# Entry format
# ---------------------------------------------------------------------------
#   name      REQUIRED  the file name to download (a bare name, no path)
#   url       REQUIRED  direct download URL
#   sha256    optional  verified after download; the file is discarded on a
#                       mismatch. Absent means "not pinned yet" -- fetch_data.py
#                       prints the hash it got, which is what you paste here.
#                       Also what makes an update reach a deployment: a file
#                       on disk installed under another sha256 is replaced.
#   release_name  the file's name in the data releases of this repository
#                 (scripts/publish_data_release.py). Required for a file to be
#                 republished; entries sharing a url share it. Two schemes:
#                   model.<tool>.<name>   a model, under the tool that owns it
#                   TestFile<NNN>[_<time>]_<modality>[_<arch>][_<content>...].<ext>
#                       NNN       one number per published file, never reused,
#                                 and never tied to a patient
#                       time      T1, T2 or T1T2, when the data has timepoints
#                       modality  CBCT, IOS, IOSCBCT, MRICBCT -- or lm, ROI,
#                                 Measurements for what is not a scan
#                       arch      U, L or UL, for IOS
#                       content   in this order, only what is present: Or
#                                 (oriented), Seg, lm (landmarks), Surface,
#                                 Matrix, Reg (registered), DCM (DICOM)
#                       ext       the real one: .nii.gz, .vtk, or .zip for a folder
#   size      optional  bytes, for the size report before a run. Informational.
#   extract   optional  true -> unpack the zip and keep the FOLDER, dropping
#                       the archive. A single top-level folder inside the
#                       archive is stripped, so DATA/<tool>/models/<bundle>/
#                       always holds the real content directly.
#   dest      optional  path under DATA/<tool>/<kind>/ overriding `name`.
#                       Two uses: giving several files that share a name their
#                       own folder (every nnUNet bundle ships a file literally
#                       called checkpoint_final.pth), and grouping many
#                       archives into ONE bundle folder -- which matters
#                       because `server_selectable="model"` shows one dropdown
#                       entry per top-level name, and the tool receives one.
#   split     optional  a prefix. Each top-level subfolder of the extracted
#                       entry (a cohort's T1/, T2/) is also published as
#                       DATA/<tool>/<kind>/<split>_<subfolder>/<entry>/,
#                       hardlinked, so it costs directory entries and no data.
#                       This is what a per-timepoint picker scope draws from
#                       (`server_selectable = { t1 = "testfile:CBCT_T1" }`).
#                       Rebuilt when missing, so re-running the fetch also
#                       repairs a DATA/ staged before the key existed.
#
# ---------------------------------------------------------------------------
# Sizes -- read this before running the whole thing
# ---------------------------------------------------------------------------
# Everything together is about 29 GB across 14 tools, and ALI's CBCT models
# are 12 GB of it. Fetch one tool at a time unless you really want all of it:
#
#     ./scripts/setup-models.sh --tool AMASSS
#     python3 scripts/fetch_data.py --list        # sizes per tool, downloads nothing
#
# Anything already on disk is skipped, so re-running only fetches what is
# missing and an interrupted run resumes by simply being restarted. An entry
# with a sha256 is the exception: when the pin changes, the file on disk is
# replaced. Changing a file is therefore publishing the new one and updating
# its `url` and `sha256` here; every deployment then downloads that file and
# nothing else.
#
# ---------------------------------------------------------------------------
# Status of each tool
# ---------------------------------------------------------------------------
# AMASSS, SurgMovPred, ALI and CrownSeg are the tools that exist on the server
# today; their entries are known-good against the current code. Everything
# below them is staged for a port that has not happened yet, so treat those
# paths as a proposal: every URL below was checked live, but which files the
# future tool will actually want is not settled.
#
# Two consequences of `DATA/` being organized per tool, worth knowing before
# the ports start:
#
#   * Every tool owns its model. A tool that needs another tool's work --
#     AREG and VFACE want AMASSS's masks and ASO's orientation -- calls that
#     tool, which resolves its OWN bundle from DATA/<its own name>/. So
#     AMASSS_Models is listed under AMASSS only and the CBCT/IOS reference
#     planes under ASO only; a caller never holds a copy. What is still listed
#     twice is a different publication that happens to share a name (ASO's
#     landmark weights are not ALI's -- see the ASO block).
#   * A few things the client downloads are deliberately absent: Slicer's
#     boilerplate SampleData (the two SlicerTestingData SHA256 blobs every
#     wizard-generated module carries), the Windows WSL2 installer, the
#     ITK-SNAP binary GreedyReg shells out to, and MRI2CBCT's literal "xxx"
#     placeholder URLs. None of them is server-side tool data.

tools:

  # =========================================================================
  # AMASSS -- CBCT skull structure segmentation. LIVE on the server.
  # =========================================================================
  AMASSS:
    models:
      # Verified to contain exactly the 9 codes AMASSSLogic.STRUCTURE_CODES
      # declares -- CB, CBMASK, CV, MAND, MANDMASK, MAX, MAXMASK, SKIN, UAW --
      # one folder each, which is the <bundle>/<CODE>/ layout resolve_models
      # expects. lucanchling/AMASSS_CBCT's separate Masks_Models.zip is
      # therefore redundant and deliberately not listed.
      - name: AMASSS_Models.zip
        url: https://github.com/DCBIA-OrthoLab/SADT-VISOR/releases/download/data-2026.10.09-1/model.AMASSS.AMASSS_Models.zip
        release_name: model.AMASSS.AMASSS_Models.zip
