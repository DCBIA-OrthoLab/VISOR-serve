# Server-side data: what to download, and where it goes.
#
# Read by scripts/fetch_data.py (and therefore by setup-models.sh /
# setup-testfiles.sh). Every entry lands under the layout server/data_store.py
# reads, so a file fetched here shows up in GET /tools/<tool>/data with no
# further step:
#
#     DATA/<tool>/models/<name>
#     DATA/<tool>/testfiles/<name>
#
# ---------------------------------------------------------------------------
# Entry format
# ---------------------------------------------------------------------------
#   name      REQUIRED  the file name to download (a bare name, no path)
#   url       REQUIRED  direct download URL
#   sha256    optional  verified after download; the file is discarded on a
#                       mismatch. Absent means "not pinned yet" -- fetch_data.py
#                       prints the hash it got, which is what you paste here.
#   size      optional  bytes, for the size report before a run. Informational.
#   extract   optional  true -> unpack the zip and keep the FOLDER, dropping
#                       the archive. A single top-level folder inside the
#                       archive is stripped, so DATA/<tool>/models/<bundle>/
#                       always holds the real content directly.
#   dest      optional  path under DATA/<tool>/<kind>/ overriding `name`.
#                       Two uses: giving several files that share a name their
#                       own folder (every nnUNet bundle ships a file literally
#                       called checkpoint_final.pth), and grouping many
#                       archives into ONE bundle folder -- which matters
#                       because `server_selectable="model"` shows one dropdown
#                       entry per top-level name, and the tool receives one.
#
# ---------------------------------------------------------------------------
# Sizes -- read this before running the whole thing
# ---------------------------------------------------------------------------
# Everything together is about 29 GB across 14 tools, and ALI's CBCT models
# are 12 GB of it. Fetch one tool at a time unless you really want all of it:
#
#     ./scripts/setup-models.sh --tool AMASSS
#     python3 scripts/fetch_data.py --list        # sizes per tool, downloads nothing
#
# Anything already on disk is skipped, so re-running only fetches what is
# missing and an interrupted run resumes by simply being restarted.
#
# ---------------------------------------------------------------------------
# Status of each tool
# ---------------------------------------------------------------------------
# AMASSS and SurgMovPred are the tools that exist on the server today; their
# entries are known-good against the current code. Everything below them is
# staged for a port that has not happened yet (see ALI_PORT_CONTEXT.md), so
# treat those paths as a proposal: every URL below was checked live, but which
# files the future tool will actually want is not settled.
#
# Two consequences of `DATA/` being organized per tool, worth knowing before
# the ports start:
#
#   * Shared assets get duplicated. AMASSS_Models.zip is wanted by AMASSS,
#     AREG and VFACE; the ALIDDM IOS weights by ALI and ASO. A tool can only
#     read DATA/<its own name>/, so the copy is listed once per tool that
#     genuinely needs it -- and, for the unported ones, not listed at all yet
#     rather than eagerly duplicating gigabytes.
#   * A few things the client downloads are deliberately absent: Slicer's
#     boilerplate SampleData (the two SlicerTestingData SHA256 blobs every
#     wizard-generated module carries), the Windows WSL2 installer, the
#     ITK-SNAP binary GreedyReg shells out to, and MRI2CBCT's literal "xxx"
#     placeholder URLs. None of them is server-side tool data.

tools:

  # =========================================================================
  # AMASSS -- CBCT skull structure segmentation. LIVE on the server.
  # =========================================================================
  AMASSS:
    models:
      # Verified to contain exactly the 9 codes AMASSSLogic.STRUCTURE_CODES
      # declares -- CB, CBMASK, CV, MAND, MANDMASK, MAX, MAXMASK, SKIN, UAW --
      # one folder each, which is the <bundle>/<CODE>/ layout resolve_models
      # expects. lucanchling/AMASSS_CBCT's separate Masks_Models.zip is
      # therefore redundant and deliberately not listed.
      - name: AMASSS_Models.zip
        url: https://github.com/DCBIA-OrthoLab/SlicerAutomatedDentalTools/releases/download/AMASSS_CBCT/AMASSS_Models.zip
        size: 2078744372
        extract: true
    testfiles:
