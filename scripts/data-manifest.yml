  # =========================================================================
  # ALI -- landmark identification. LIVE on the server.
  #
  # 13 GB of CBCT models. Ask for them on their own:
  #     python3 scripts/fetch_data.py --kind models --tool ALI
  #
  # All three bundle names below are what the tool actually reads:
  #   * ALI_CBCT_Models/ -> engine.discover_weights walks it recursively for
  #     <landmark>/<scale>/*.pth, so the eight region archives unpack side by
  #     side into one bundle and one dropdown entry.
  #   * ALI_IOS_Models/  -> Upper_O_model.pth, Lower_O_model.pth,
  #     Upper_C_model.pth, Lower_C_model.pth (verified against the published
  #     archive). Each name carries an O/C token and an Upper/Lower one, which
  #     is the single naming rule ALI_IOS/engine.discover_weights applies.
  #   * Crown_Seg_Model/ -> the crown-segmentation checkpoint, read by
  #     Crown_Seg and not by ALI. See below for why it is staged here.
  #
  # Three bundles under DATA/ALI/models/ and none of them can be mistaken for
  # another: the server hands a hosted-model argument the whole models FOLDER
  # when the caller names no bundle, and each engine recognises its own weights
  # inside by their shape (dispatch._server_provided). ALI_CBCT walks for
  # <landmark>/<scale>/*.pth, ALI_IOS for the O/C plus Upper/Lower tokens, and
  # Crown_Seg for the `val-loss` token of a Fly-by-CNN training run -- so all
  # 244 .pth files can sit side by side and each tool picks out its own.
  #
  # Two published packagings of the same CBCT weights exist:
  #
  #   * DCBIA .../v0.1-v2.0_models/ -- 8 archives grouped by region, Nov 2023.
  #     USED HERE. It is what the ALI module's own "Download latest models"
  #     button pulls (and what GreedyReg and AREG's IOSCBCT mode reuse), and it
  #     carries landmarks the other release lacks (C2, C3, C4, LFZyg, RFZyg).
  #   * lucanchling/ALI_CBCT models_v01 -- the same weights as 112 individual
  #     single-landmark archives, 12 GB. Still live in the client (AREG and ASO
  #     build "<base>/<landmark>.zip" URLs against it at runtime), so not dead
  #     -- but unusable here, since 112 archives means 112 dropdown entries
  #     where the tool is handed exactly one model name.
  #
  # Both unpack to the same <landmark>/<scale>/<LM>_Net_<scale>.pth shape (the
  # two spacings the agent walks, 1 mm then 0.3 mm). `dest` files every group
  # under ONE ALI_CBCT_Models/ bundle, because server_selectable="model" hands
  # the tool a single chosen name:
  #
  #     DATA/ALI/models/ALI_CBCT_Models/Cranial_Base/Ba/1/Ba_Net_1.pth
  # =========================================================================
