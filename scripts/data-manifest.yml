  # =========================================================================
  # ASO -- automated standardized orientation. Packaged in SADT-VISOR;
  # the data below is still served from DATA/ASO/.
  #
  # Three bundles this block used to fetch have been REMOVED rather than left
  # in place, because nothing on either side of the port reads them:
  #
  #   * CBCT_PreASOModels (410 MB) -- PRE_ASO_CBCT.py imports PreASOResample
  #     and never calls it, and ASO_CBCT_utils/__init__.py has
  #     `# from .Net import DenseNet` commented out. The learned orientation
  #     step was removed upstream ("ENH: Remove Pred Pre ASO CBCT step"); all
  #     that survives is a recentring translation, which needs no model.
  #   * IOS_landmark_models (189 MB) -- Auto_IOS.Process runs crown
  #     segmentation then a tooth-centroid ICP. No landmark network is
  #     involved; getALIModelList() is declared and never used.
  #   * IOS_segmentation_model -- the dentalmodelseg/shapeaxi path. It belongs
  #     to a future tools/CrownSeg (ALI, ASO, AREG and FlexReg all want it) and
  #     is blocked on the base image gaining pytorch3d. ASO's fully-automated
  #     IOS mode takes already-segmented meshes.
  # =========================================================================
  ASO:
    models:
      # Landmark weights for Fully-Automated CBCT. ASO does not predict
      # landmarks itself -- it asks the ALI tool for them, mid-run, through
      # the supervisor the runner injects (`sup.run("ALI", ...)`).
      #
      # They live under DATA/ASO/ because `landmark_model` is
      # server_selectable on ASO's schema, and GET /tools/{tool}/data is
      # per tool: the client's dropdown lists DATA/ASO/models/ and main.py
      # resolves the name there before ASO ever runs.
      #
      # These are NOT the weights DATA/ALI/models/ holds, and an earlier note
      # here said they were -- inviting a `cp -al` that would have replaced them
      # silently. Measured 2026-09-10: every checkpoint differs, at both scales,
      # for every landmark compared (Ba, S, N, RPo). Two separate publications,
      # two separate trainings of the same landmarks:
      #
      #     ASO   lucanchling/ALI_CBCT                models_v01
      #     ALI   DCBIA-OrthoLab/SlicerAutomated...   v0.1-v2.0_models
      #
      # So DO NOT hard-link them, and do not deduplicate them. ASO's published
      # reference planes were built with THESE weights; swapping in ALI's would
      # move the landmarks a little, move the registration with them, and produce
      # oriented scans nobody could tell were wrong -- every one of them
      # plausible.
      #
      # Each tool keeps its own: ALI's predict for ALI, ASO's for ASO. That costs
      # 782 MB and buys the only thing that matters here -- knowing which weights
      # a result came from.
      #
      # Curated to the seven landmarks the published reference planes are
      # built on (ASO's own defaults), not all 112: that is 758 MB instead of
      # roughly 12 GB. Add a landmark here the day someone selects it.
      # Verified 2026-07-31: each archive holds its scales at the root
      # (0-3/<LM>_Net_0-3.pth, 1/<LM>_Net_1.pth), which is why `dest` nests
      # them one level -- GetBrain keys on <LM>/<scale>/*.pth.
      - name: Ba.zip
        dest: CBCT_landmark_models/Ba
        url: https://github.com/DCBIA-OrthoLab/SADT-VISOR/releases/download/data-2026.10.09-1/model.ASO.Ba.zip
