  #     archive). Each name carries an O/C token and an Upper/Lower one, which
  #     is the single naming rule ALI_IOS/engine.discover_weights applies.
  #
  # Two published packagings of the same CBCT weights exist:
  #
  #   * DCBIA .../v0.1-v2.0_models/ -- 8 archives grouped by region, Nov 2023.
  #     USED HERE. It is what the ALI module's own "Download latest models"
