      # because `FullyAuto` says which of AREG's modes it was for, not what it
      # holds, and the name is what a user reads in the dropdown.
      #
      # This pointed at `AREG_test_scans.zip` until a coverage run tried it.
      # That archive is AREG's IOS cohort -- two `.vtk` arch surfaces, 3.7 MB --
      # and this tool registers CBCT VOLUMES, so it saw no scan in either
      # folder and answered "No patient appears in both the T1 and the T2
      # folder" with zero on each side. The dropdown offered exactly one test
      # file and it could only ever 422, which is how a tool ends up with
      # staged test data nobody has ever successfully run it on. The name
      # `CBCT_T1_T2_pair` was right all along; the archive under it was not.
      #
      # An install that already fetched the wrong one keeps it: fetch_data.py
